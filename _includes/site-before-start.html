{% if site.preview_mode %}
<meta name="robots" content="noindex">
{% endif %}
<style>
  .feature .container > p {
    margin-bottom: 0;
    padding-top: 0;
    font-size: 3rem;
    font-weight: 600;
    line-height: 1.25;
  }

  /* Keep unordered-list markers within the main text column. */
  .typeset ul li {
    margin-left: 2rem;
  }

  @media screen and (max-width: 39.999em) {
    .header .nav {
      margin-left: auto;
    }

    .feature .container > p {
      font-size: 2.5rem;
    }
  }

{% if site.preview_mode %}

    margin: 0;
    padding: 0.75rem 0;
    border-top: 1px solid #555;
    border-bottom: 1px solid #555;
    background: #333;
    color: #fff;
  }

  .preview-banner p {
    margin: 0;
  }

  .preview-banner strong {
    color: inherit;
  }
