{% if site.preview_mode %}
<meta name="robots" content="noindex">
{% endif %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<style>
  .feature .container > p {
    margin-bottom: 0;
    padding-top: 0;
    font-size: 3rem;
    font-weight: 600;
    line-height: 1.25;
  }

  .feature--home {
    background-color: #eee9d8;
    background-image:
      linear-gradient(90deg, rgba(249, 248, 239, 0.88) 0%, rgba(249, 248, 239, 0.7) 48%, rgba(249, 248, 239, 0.38) 100%),
      url("{{ '/assets/images/home-hero-desktop.png' | relative_url }}");
    background-position: center;
    background-size: cover;
  }

  .feature--home .container {
    min-height: 42vh;
    max-width: 1200px;
    align-items: flex-start;
    text-align: left;
  }

  .feature--home .container > p {
    max-width: 13ch;
    color: #263a2d;
    text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8);
  }

  /* Keep unordered-list markers within the main text column. */
  .typeset ul li {
    margin-left: 2rem;
  }

  @media screen and (max-width: 39.999em) {
    .header .nav {
      margin-left: auto;
    }

    .feature .container > p {
      font-size: 2.5rem;
    }

    .feature--home {
      background-image:
        linear-gradient(rgba(249, 248, 239, 0.72), rgba(249, 248, 239, 0.58)),
        url("{{ '/assets/images/home-hero-mobile.png' | relative_url }}");
      background-position: center 30%;
    }

    .feature--home .container {
      min-height: 30vh;
      align-items: flex-start;
      text-align: left;
    }

    .feature--home .container > p {
      max-width: 18ch;
      font-size: 2.25rem;
    }
  }

{% if site.preview_mode %}
  .preview-banner {
    margin: 0;
    padding: 0.75rem 0;
    border-top: 1px solid #555;
    border-bottom: 1px solid #555;
    background: #333;
    color: #fff;
  }

  .preview-banner p {
    margin: 0;
  }

  .preview-banner strong {
    color: inherit;
  }
{% endif %}
</style>
