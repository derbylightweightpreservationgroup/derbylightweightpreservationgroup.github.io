url: "https://derbylightweightpreservationgroup.github.io"
baseurl: ""
preview_mode: true

remote_theme: daviddarnes/alembic@4.1.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-paginate

permalink: pretty
